<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Marks Analyzer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Marks Analyzer</h1>

        <div class="card">
            <h2>Student Marks</h2>

            <p id="marksDisplay"></p>
        </div>


        <div class="card">

            <h2>Results</h2>

            <p id="totalMarks"></p>

            <p id="averageMarks"></p>

            <p id="passedMarks"></p>

            <p id="highestMark"></p>

            <p id="lowestMark"></p>

            <p id="check90"></p>

            <p id="firstAbove90"></p>

        </div>


        <div class="card">

            <h2>Students Who Passed</h2>

            <ul id="studentList"></ul>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
